<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" role="img" aria-labelledby="viz-pipeline-title">
  <title id="viz-pipeline-title">Text-as-data pipeline for media discourse</title>
  <rect width="1200" height="900" fill="#143f29"/>
  <g stroke="#e8dcc0" stroke-opacity=".18" stroke-width="1">
    <path d="M0 150H1200M0 300H1200M0 450H1200M0 600H1200M0 750H1200"/>
    <path d="M200 0V900M400 0V900M600 0V900M800 0V900M1000 0V900"/>
  </g>
  <g font-family="Archivo, Helvetica, Arial, sans-serif">
    <text x="56" y="76" fill="#e8dcc0" font-size="15" letter-spacing="5">VISUALIZATION / PIPELINE</text>
    <text x="56" y="150" fill="#ffffff" font-size="36" font-weight="700" letter-spacing="-1">FROM NEWSPAPERS TO STANCES</text>
    <rect x="56" y="300" width="236" height="200" fill="none" stroke="#e8dcc0" stroke-width="1.5"/>
    <text x="76" y="334" fill="#bcd8c7" font-size="11" letter-spacing="3">01 · CORPUS</text>
    <text x="76" y="382" fill="#ffffff" font-size="22" font-weight="700">8,000</text>
    <text x="76" y="406" fill="#d7e6dc" font-size="13">NEWSPAPER ARTICLES</text>
    <text x="76" y="428" fill="#d7e6dc" font-size="13">2010–2024</text>

    <rect x="340" y="300" width="236" height="200" fill="none" stroke="#e8dcc0" stroke-width="1.5"/>
    <text x="360" y="334" fill="#bcd8c7" font-size="11" letter-spacing="3">02 · TOPICS</text>
    <text x="360" y="382" fill="#ffffff" font-size="22" font-weight="700">5</text>
    <text x="360" y="406" fill="#d7e6dc" font-size="13">DISCOURSE CLUSTERS</text>
    <text x="360" y="428" fill="#d7e6dc" font-size="13">MINING · TRANSITION · CRISIS</text>

    <rect x="624" y="300" width="236" height="200" fill="none" stroke="#e8dcc0" stroke-width="1.5"/>
    <text x="644" y="334" fill="#bcd8c7" font-size="11" letter-spacing="3">03 · ACTORS</text>
    <text x="644" y="382" fill="#ffffff" font-size="22" font-weight="700">NER</text>
    <text x="644" y="406" fill="#d7e6dc" font-size="13">ORGANISATIONS · REGIONS</text>
    <text x="644" y="428" fill="#d7e6dc" font-size="13">TECHNOLOGIES</text>

    <rect x="908" y="300" width="236" height="200" fill="#e8dcc0"/>
    <text x="928" y="334" fill="#1d5c3a" font-size="11" letter-spacing="3">04 · STANCE</text>
    <text x="928" y="382" fill="#143f29" font-size="22" font-weight="700">CLASSIFIER</text>
    <text x="928" y="406" fill="#1d5c3a" font-size="13">SKEPTICS · OPPORTUNISTS</text>
    <text x="928" y="428" fill="#1d5c3a" font-size="13">REALISTS</text>

    <g stroke="#e8dcc0" stroke-width="2" fill="none">
      <path d="M298 400H328M314 390L326 400L314 410"/>
      <path d="M582 400H612M598 390L610 400L598 410"/>
      <path d="M866 400H896M882 390L894 400L882 410"/>
    </g>
    <text x="56" y="828" fill="#bcd8c7" font-size="12" letter-spacing="2">SOUTH AFRICA · INDIA · COLOMBIA · INDONESIA · SPAIN</text>
  </g>
</svg>
